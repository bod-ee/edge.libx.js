# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        # NOTE: To enable Github Actions for CI/CD remove 'false' condition 👇
        if: ${{ !contains(github.event.head_commit.message, 'skip-ci') }}

        runs-on: ubuntu-latest

        # bump.sh pushes the version-bump commit + tag back to the repo; the
        # default GITHUB_TOKEN is read-only, which 403s on push. Grant write.
        permissions:
            contents: write

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3
              with:
                repository: ${{ github.event.pull_request.head.repo.full_name }}
                ref: ${{ github.event.pull_request.head.ref }}
                
            # Setup .npmrc file to publish to npm
            - uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@octocat'
            - uses: oven-sh/setup-bun@v2

            - run: bun install
            - run: bun run build
            # The suite gates the publish. It was not wired before, and `bun run test`
            # was itself broken ("Multiple configurations found") — a library that
            # publishes without ever running its own tests is a trap.
            - run: bun run test
            - name: Pull NPM_TOKEN from bodify secrets store
              if: github.ref == 'refs/heads/main'
              # The npm token is NOT a per-repo secret — a repo-scoped NPM_TOKEN goes stale silently and every
              # publish then dies on a 404. Pull the canonical token from bodify at publish time, so rotating it
              # in ONE place fixes every repo. Only GitHub secret needed: BODIFY_API_KEY.
              env:
                BODIFY_API_KEY: ${{ secrets.BODIFY_API_KEY }}
              run: |
                TOKEN=$(curl -fsS -H "Authorization: Bearer $BODIFY_API_KEY" \
                  "https://bodify.bod.ee/api/apps/9ddba0fb-03bc-4490-8577-5e094b5b6792/env/NPM_TOKEN?environment=prod" \
                  | jq -r '.value')
                [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from bodify"; exit 1; }
                echo "::add-mask::$TOKEN"
                echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
                # yarn publish does not consume NODE_AUTH_TOKEN the way `npm publish` does — write the
                # literal auth line into the npmrc that setup-node created (it points NPM_CONFIG_USERCONFIG there).
                NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
                echo "//registry.npmjs.org/:_authToken=$TOKEN" >> "$NPMRC"
            - name: bun run bump
              if: github.ref == 'refs/heads/main'
              run: |
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
                  git config user.name "$GITHUB_ACTOR"
                  yarn bump
              env:
                  # NOTE: Make sure to set up your NPM secret in Github
                  NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}

